<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian AI Assistant - Interactive Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ffb300;
            --primary-hover: #e6a200;
            --bg-outer: #d1d5db; /* gray-300 */
            --bg-app: #f3f4f6;   /* gray-100 */
            --bg-chat: #ffffff;
            --bg-bubble: #f3f4f6; 
            --text-main: #111827;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-outer);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Main App Container */
        .app-container {
            width: 100%;
            max-width: 1280px;
            height: 90vh;
            background-color: var(--bg-app);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-app);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-logo img {
            height: 36px;
        }

        .header-title-area {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        .badge-role {
            background-color: #dcfce7;
            color: #166534;
        }
        
        .badge-region {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background-color: #94a3b8;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        /* Body Layout */
        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--bg-app);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            letter-spacing: 0.5px;
            padding-left: 8px;
        }

        .nav-btn {
            background-color: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            font-size: 13px;
            text-align: left;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: white;
            border: 1px solid var(--border-color);
        }

        .nav-btn.active {
            background-color: white;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        /* Chat Area */
        .chat-main {
            flex: 1;
            background-color: var(--bg-chat);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 120px;
        }

        /* Messages */
        .message {
            display: flex;
            width: 100%;
        }

        .user-message {
            justify-content: flex-end;
        }

        .ai-message {
            justify-content: flex-start;
        }

        .bubble-user {
            background-color: var(--primary); /* Keep McCain yellow */
            color: #000000;
            padding: 12px 20px;
            border-radius: 16px;
            border-bottom-right-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            max-width: 70%;
            box-shadow: 0 2px 4px rgba(255, 179, 0, 0.2);
            line-height: 1.5;
        }

        .bubble-ai {
            background-color: var(--bg-bubble);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            font-size: 14px;
            color: var(--text-main);
            max-width: 800px;
            width: 100%;
            line-height: 1.5;
        }

        .ai-text-content {
            margin-bottom: 16px;
        }

        /* Internal Card within AI Bubble */
        .data-card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .data-card-header {
            padding: 12px 16px;
            border-bottom: 1px dashed var(--border-color);
            background-color: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .data-card-title {
            font-weight: 600;
            font-size: 13px;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid;
            letter-spacing: 0.5px;
        }
        
        .status-badge.delayed {
            color: #dc2626;
            background-color: #fef2f2;
            border-color: #fca5a5;
        }
        
        .status-badge.healthy {
            color: #059669;
            background-color: #ecfdf5;
            border-color: #6ee7b7;
        }

        .data-card-body {
            padding: 16px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table td {
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }

        .data-table .label {
            color: var(--text-secondary);
            width: 50%;
        }

        .data-table .value {
            font-weight: 500;
        }

        .bubble-footer {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 12px;
            display: flex;
            gap: 16px;
        }

        .bubble-footer a {
            color: #2563eb;
            text-decoration: none;
        }

        /* Input Area */
        .input-area {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            background: linear-gradient(transparent, var(--bg-chat) 20%);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 6px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #d1d5db;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            outline: none;
            background: transparent;
        }

        .send-btn {
            background-color: #dc2626; /* Using a distinct color for send like the ref */
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-right: 4px;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #b91c1c;
        }

        .input-footer {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-top: 12px;
        }

        /* Initial Screen */
        .initial-suggestions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
            margin-top: 40px;
        }
        
        .initial-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        /* Loading */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }
        
        .dot {
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="header-logo">
                    <img src="logo.png" alt="McCain">
                </div>
                <div class="header-title-area">
                    <span class="header-title">Meridian Order Assist</span>
                    <span class="header-subtitle">in MCX • powered by Genie + Azure AI Foundry</span>
                </div>
            </div>
            <div class="header-right">
                <span class="badge badge-role">Role: CS Agent</span>
                <span class="badge badge-region">Region: EMENA-GB</span>
                <div class="avatar">AK</div>
            </div>
        </header>

        <!-- Main Body -->
        <div class="main-body">
            
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">FAQS</div>
                    <button class="nav-btn" onclick="askQuestion(3)">Where is order [ID]?</button>
                    <button class="nav-btn" onclick="askQuestion(1)">Which orders haven't shipped?</button>
                    <button class="nav-btn">What's the returns policy?</button>
                    <button class="nav-btn">Orders below reorder point</button>
                </div>
                
                <div class="sidebar-section">
                    <div class="sidebar-title">RECENT</div>
                    <button class="nav-btn active" onclick="askQuestion(3)">Status of order 4500123</button>
                    <button class="nav-btn" onclick="askQuestion(2)">Top 5 SKUs by revenue</button>
                    <button class="nav-btn">Shortages for GB last week</button>
                </div>
            </aside>

            <!-- Chat Area -->
            <main class="chat-main">
                <div class="chat-container" id="chat-container">
                    <div id="initial-state">
                        <div class="initial-title">How can I help you today?</div>
                        <div class="initial-suggestions">
                            <button class="nav-btn" style="background: white; border: 1px solid var(--border-color); padding: 12px 16px; text-align: center;" onclick="askQuestion(3)">Is order 4500123 for Acme delayed, and what does our returns policy allow if it is?</button>
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-wrapper">
                        <input type="text" id="chat-input" placeholder="Ask about an order, delivery, stock, shortage or billing..." onkeypress="handleEnter(event)">
                        <button class="send-btn" onclick="handleSend()">Send</button>
                    </div>
                    <div class="input-footer">
                        Answers are grounded in governed EDP data and cite their source. The assistant is read-only and will say when it doesn't have the information.
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const initialState = document.getElementById('initial-state');
        const chatInput = document.getElementById('chat-input');

        function appendUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message user-message';
            msgDiv.innerHTML = `<div class="bubble-user">${text}</div>`;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function appendAIMessage(htmlContent) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-message';
            msgDiv.innerHTML = `<div class="bubble-ai">${htmlContent}</div>`;
            chatContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        function showLoading() {
            const loader = document.createElement('div');
            loader.id = 'loading';
            loader.className = 'message ai-message';
            loader.innerHTML = `
                <div class="bubble-ai" style="padding: 12px 20px; max-width: 80px;">
                    <div class="typing-indicator">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(loader);
            scrollToBottom();
        }

        function hideLoading() {
            const loader = document.getElementById('loading');
            if(loader) loader.remove();
        }
        
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function askQuestion(qNum) {
            if(initialState) initialState.style.display = 'none';
            
            let userText = '';
            let aiResponse = '';
            
            if (qNum === 1) {
                userText = 'Which orders haven\\'t shipped for product XXX?';
                aiResponse = \`
                    <div class="ai-text-content">I found 3 orders containing Product XXX that are pending shipment. Here are the details:</div>
                    <div class="data-card">
                        <div class="data-card-header">
                            <span class="data-card-title">📦 Unshipped Orders · Product XXX</span>
                        </div>
                        <div class="data-card-body">
                            <table class="data-table">
                                <tr>
                                    <td class="label">Order 124</td>
                                    <td class="value">Scheduled to load: Oct 26</td>
                                </tr>
                                <tr>
                                    <td class="label">Order 128</td>
                                    <td class="value">Credit Hold</td>
                                </tr>
                                <tr>
                                    <td class="label">Order 135</td>
                                    <td class="value">Pending material availability</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div class="bubble-footer">
                        <span>Data as of 14:00 (refreshed every 2h)</span>
                        <a href="#">View SQL</a>
                        <span style="cursor: pointer;">▲ helpful</span>
                    </div>
                \`;
            } else if (qNum === 2) {
                userText = 'Show me the top 5 SKUs by total revenue.';
                aiResponse = \`
                    <div class="ai-text-content">Here are the top 5 SKUs by total revenue (your region):</div>
                    <div class="data-card">
                        <div class="data-card-body" style="padding: 0;">
                            <table class="data-table" style="margin: 0;">
                                <tr style="background: #f9fafb; border-bottom: 1px solid var(--border-color);">
                                    <th style="text-align: left; padding: 12px 16px; font-weight: 600; font-size: 12px; color: var(--text-secondary);">SKU</th>
                                    <th style="text-align: left; padding: 12px 16px; font-weight: 600; font-size: 12px; color: var(--text-secondary);">Product</th>
                                    <th style="text-align: left; padding: 12px 16px; font-weight: 600; font-size: 12px; color: var(--text-secondary);">Revenue</th>
                                </tr>
                                <tr>
                                    <td style="padding: 12px 16px; border-bottom: 1px solid #f3f4f6;">SKU-1001</td>
                                    <td style="padding: 12px 16px; border-bottom: 1px solid #f3f4f6;">Fries 9mm 2.5kg</td>
                                    <td style="padding: 12px 16px; border-bottom: 1px solid #f3f4f6;">£184,320</td>
                                </tr>
                                <tr>
                                    <td style="padding: 12px 16px; border-bottom: 1px solid #f3f4f6;">SKU-2042</td>
                                    <td style="padding: 12px 16px; border-bottom: 1px solid #f3f4f6;">Wedges 2.5kg</td>
                                    <td style="padding: 12px 16px; border-bottom: 1px solid #f3f4f6;">£142,150</td>
                                </tr>
                                <tr>
                                    <td style="padding: 12px 16px;">SKU-1088</td>
                                    <td style="padding: 12px 16px;">Hashbrowns 1kg</td>
                                    <td style="padding: 12px 16px;">£98,400</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div class="bubble-footer">
                        <span>Data as of 14:00 (refreshed every 2h)</span>
                        <a href="#">View SQL</a>
                        <span style="cursor: pointer;">▲ helpful</span>
                    </div>
                \`;
            } else if (qNum === 3) {
                userText = 'Is order 4500123 for Acme delayed, and what does our returns policy allow if it is?';
                aiResponse = \`
                    <div class="ai-text-content">
                        Order <strong>4500123</strong> for <strong>Acme Foods</strong> is currently <strong>delayed</strong>. The delivery is created but the shipment hasn't been scheduled yet.
                    </div>
                    <div class="data-card">
                        <div class="data-card-header">
                            <span class="data-card-title">Order 4500123 · Acme Foods</span>
                            <span class="status-badge delayed">DELAYED</span>
                        </div>
                        <div class="data-card-body">
                            <table class="data-table">
                                <tr>
                                    <td class="label">Status</td>
                                    <td class="value">Ordered / confirmed</td>
                                </tr>
                                <tr>
                                    <td class="label">Delivery created, not shipped</td>
                                    <td class="value">1,200 / 1,050 cases</td>
                                </tr>
                                <tr>
                                    <td class="label">Planned load (PGI)</td>
                                    <td class="value">Sales org</td>
                                </tr>
                                <tr>
                                    <td class="label">14 Jul (past due)</td>
                                    <td class="value">GB01</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div class="ai-text-content" style="font-size: 13px; color: var(--text-secondary); margin-bottom: 0;">
                        On returns: for a delayed/short delivery, the customer may request a credit or re-delivery within the agreed window.<br>
                        <strong>Source: Returns & Quality Policy · §3.2</strong>
                    </div>
                    <div class="bubble-footer">
                        <span>Data as of 14:00 (refreshed every 2h)</span>
                        <a href="#">View SQL</a>
                        <span style="cursor: pointer;">▲ helpful</span>
                    </div>
                \`;
            } else {
                userText = 'Where is Order #12345?';
                aiResponse = \`
                    <div class="ai-text-content">Order <strong>12345</strong> is currently in transit.</div>
                    <div class="data-card">
                        <div class="data-card-header">
                            <span class="data-card-title">Order 12345</span>
                            <span class="status-badge healthy">IN TRANSIT</span>
                        </div>
                        <div class="data-card-body">
                            <table class="data-table">
                                <tr>
                                    <td class="label">Origin</td>
                                    <td class="value">Florence, SC</td>
                                </tr>
                                <tr>
                                    <td class="label">Destination</td>
                                    <td class="value">Oak Brook, IL</td>
                                </tr>
                                <tr>
                                    <td class="label">Estimated Delivery</td>
                                    <td class="value">Oct 29, 2023</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div class="bubble-footer">
                        <span>Data as of 14:00 (refreshed every 2h)</span>
                        <a href="#">View SQL</a>
                        <span style="cursor: pointer;">▲ helpful</span>
                    </div>
                \`;
            }
            
            appendUserMessage(userText);
            showLoading();
            
            setTimeout(() => {
                hideLoading();
                appendAIMessage(aiResponse);
            }, 1000);
        }

        function handleSendText(text) {
            if(initialState) initialState.style.display = 'none';
            appendUserMessage(text);
            showLoading();
            setTimeout(() => {
                hideLoading();
                appendAIMessage("<div class='ai-text-content' style='margin-bottom:0;'>I am an interactive prototype. In a live system, I would process this request by querying SAP and Databricks.</div>");
            }, 1000);
        }

        function handleSend() {
            const text = chatInput.value.trim();
            if(!text) return;
            chatInput.value = '';
            handleSendText(text);
        }

        function handleEnter(e) {
            if(e.key === 'Enter') handleSend();
        }
    </script>
</body>
</html>
